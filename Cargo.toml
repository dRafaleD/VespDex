[package]
name = "vespdex"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
time = { version = "0.3", features = ["parsing"] }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu"] }
rfd = { version = "0.15.4", default-features = false }
wgpu = { version = "24.0.0", default-features = false, features = ["dx12"] }
